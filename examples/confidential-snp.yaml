apiVersion: aether/v1
kind: Workload

metadata:
  name: confidential-app
  owner: security-team
  project: sovereign
  labels:
    tier: confidential

build:
  context: .
  dockerfile: Dockerfile
  registry: registry.internal/images

requirements:
  cpu: "4"
  memory: 8Gi
  storage: 50Gi

runtime:
  preferred: kubevirt
  allow:
    - kubevirt

confidential:
  enabled: true
  tee: sev-snp
  # Sign disk first: aether confidential image sign confidential-app ./disk.qcow2
  # imageDigest: "<launch-digest-from-catalog>"  # required when attestation.policy is strict
  attestation:
    required: true
    policy: strict
  isolation:
    vtpm: true
    encryptedState: true
    debugAllowed: false
  secrets:
    releasePolicy: attest-gated
    provider: vault
    names:
      - db-credentials
      - api-key

intent:
  trust: strict
  compliance:
    isolationRequired: true
