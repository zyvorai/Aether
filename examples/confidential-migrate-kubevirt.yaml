# Confidential workload prepared for encrypted migration (Phase 6)
# Plan: aether --spec examples/confidential-migrate-kubevirt.yaml confidential migration plan
# Migrate: aether migrate confidential-migrate-demo --target kubevirt --strategy confidential-blue-green
apiVersion: aether/v1
kind: Workload

metadata:
  name: confidential-migrate-demo
  owner: security-team
  project: sovereign

build:
  context: .
  dockerfile: Dockerfile
  registry: registry.internal/images

requirements:
  cpu: "4"
  memory: 8Gi
  storage: 50Gi

runtime:
  preferred: kubevirt
  allow:
    - kubevirt
    - kube

confidential:
  enabled: true
  tee: sev-snp
  # Register digest before strict migrate:
  # aether confidential image sign confidential-migrate-demo ./disk.qcow2
  # imageDigest: "<launch-digest>"
  attestation:
    required: true
    policy: standard
  isolation:
    vtpm: true
    encryptedState: true
    debugAllowed: false
  secrets:
    releasePolicy: attest-gated
    provider: vault

intent:
  trust: strict
