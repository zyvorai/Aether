apiVersion: aether/v1
kind: Workload

metadata:
  name: confidential-kata-app
  owner: security-team
  project: sovereign
  labels:
    tier: confidential

build:
  context: .
  dockerfile: Dockerfile
  registry: quay.io/confidential-containers
  tag: latest

requirements:
  cpu: 500m
  memory: 512Mi
  storage: 1Gi

runtime:
  preferred: kube
  allow:
    - kube

confidential:
  enabled: true
  tee: sev-snp
  securityProfile: standard-confidential
  attestation:
    required: true
    policy: standard
  isolation:
    vtpm: true
    encryptedState: true
    debugAllowed: false
  secrets:
    releasePolicy: attest-gated
    provider: vault
    names:
      - app-token

intent:
  goal: balanced
  trust: strict
  compliance:
    isolationRequired: true

network:
  service: true
  ports:
    - containerPort: 8080
      servicePort: 8080
      protocol: TCP
