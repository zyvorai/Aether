apiVersion: aether/v1
kind: Workload
metadata:
  name: metal3-lab-host
  owner: platform
  project: labs
  labels:
    lab: metal3
  annotations:
    aether.io/boot-mac-address: "00:11:22:33:44:55"
    aether.io/image-url: "https://example.com/metal3-lab-host.qcow2"
build:
  context: .
  dockerfile: Dockerfile
  registry: localhost
requirements:
  cpu: "32"
  memory: 128Gi
  storage: 500Gi
runtime:
  preferred: metal
  allow:
    - metal
network:
  service: false
health:
  liveness:
    exec:
      command: ["true"]
    initialDelaySeconds: 120
    periodSeconds: 30
