apiVersion: aether/v1
kind: Workload
metadata:
  name: metal3-lab-host
  owner: platform
  project: labs
  labels:
    lab: metal3
build:
  context: .
  dockerfile: Dockerfile
  registry: localhost
requirements:
  cpu: "32"
  memory: 128Gi
  storage: 500Gi
runtime:
  preferred: metal
  allow:
    - metal
network:
  service: false
health:
  liveness:
    exec:
      command: ["true"]
    initialDelaySeconds: 120
    periodSeconds: 30
