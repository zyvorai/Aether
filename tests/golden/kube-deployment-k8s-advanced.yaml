apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  labels:
    app: api
    managed-by: aether
    tier: backend
  name: api
  namespace: aether-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      managed-by: aether
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations: {}
      labels:
        app: api
        managed-by: aether
        tier: backend
    spec:
      containers:
      - image: ghcr.io/yourorg/api:latest:latest
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
        name: api
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 512Mi
      imagePullSecrets:
      - name: ghcr-pull
      nodeSelector:
        nodepool: apps
      priorityClassName: production
      serviceAccountName: api-sa
      tolerations:
      - effect: NoSchedule
        key: dedicated
        operator: Equal
        value: apps
