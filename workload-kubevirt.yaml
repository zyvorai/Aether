apiVersion: aether/v1
kind: Workload

metadata:
  name: ubuntu-vm
  owner: ops-team
  project: infrastructure
  labels:
    env: production
    tier: compute
  annotations:
    description: "Ubuntu VM for general purpose compute"

build:
  context: .
  dockerfile: Dockerfile
  registry: docker.io/library

requirements:
  cpu: "4"           # 4 CPU cores
  memory: "8Gi"      # 8GB RAM
  storage: "50Gi"    # 50GB disk
  gpu:
    vendor: "nvidia"
    count: 1

runtime:
  preferred: kubevirt  # Force KubeVirt runtime
  allow:
    - kubevirt

network:
  service: true
  ports:
    - containerPort: 22
      servicePort: 22
      protocol: TCP
    - containerPort: 80
      servicePort: 80
      protocol: TCP
    - containerPort: 443
      servicePort: 443
      protocol: TCP
  serviceType: LoadBalancer

persistence:
  enabled: true
  size: "50Gi"
  storageClass: "local-path"
  accessMode: ReadWriteOnce

health:
  liveness:
    tcpSocket:
      port: 22
    initialDelaySeconds: 60
    periodSeconds: 10
  readiness:
    tcpSocket:
      port: 22
    initialDelaySeconds: 30
    periodSeconds: 5
