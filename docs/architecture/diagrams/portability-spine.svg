<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-label="Aether: one workload YAML to Podman, Kubernetes, and KubeVirt">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0c0f"/>
      <stop offset="55%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#1a120c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas -->
  <rect width="880" height="360" rx="20" fill="url(#bg)"/>
  <circle cx="120" cy="40" r="90" fill="#f97316" fill-opacity="0.08"/>
  <circle cx="780" cy="320" r="110" fill="#fb923c" fill-opacity="0.06"/>

  <!-- Title -->
  <text x="440" y="42" fill="#fafaf9" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" text-anchor="middle">One spec. Three runtimes.</text>
  <text x="440" y="66" fill="#a8a29e" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle">Deploy · score · migrate — without rewriting infrastructure</text>

  <!-- Spec card -->
  <rect x="290" y="90" width="300" height="56" rx="14" fill="url(#glass)" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="440" y="115" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">WORKLOAD YAML</text>
  <text x="440" y="134" fill="#fafaf9" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" text-anchor="middle">apiVersion: aether/v1</text>

  <!-- Connector down -->
  <line x1="440" y1="146" x2="440" y2="172" stroke="url(#orange)" stroke-width="2"/>

  <!-- Control plane -->
  <rect x="310" y="172" width="260" height="48" rx="12" fill="#f97316" fill-opacity="0.18" stroke="#f97316" stroke-width="1.5"/>
  <text x="440" y="201" fill="#fff7ed" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Aether control plane</text>

  <!-- Fan-out lines -->
  <path d="M440 220 L440 236 L160 236 L160 252" fill="none" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.75"/>
  <path d="M440 220 L440 252" fill="none" stroke="#f97316" stroke-opacity="0.75" stroke-width="1.75"/>
  <path d="M440 220 L440 236 L720 236 L720 252" fill="none" stroke="#f97316" stroke-opacity="0.55" stroke-width="1.75"/>

  <!-- Runtime cards -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="70" y="252" width="180" height="64" rx="14" fill="url(#glass)" stroke="#57534e" stroke-width="1"/>
    <text x="160" y="280" fill="#fafaf9" font-size="15" font-weight="700" text-anchor="middle">Podman</text>
    <text x="160" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">containers</text>

    <rect x="350" y="252" width="180" height="64" rx="14" fill="url(#glass)" stroke="#57534e" stroke-width="1"/>
    <text x="440" y="280" fill="#fafaf9" font-size="15" font-weight="700" text-anchor="middle">Kubernetes</text>
    <text x="440" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">pods &amp; services</text>

    <rect x="630" y="252" width="180" height="64" rx="14" fill="url(#glass)" stroke="#57534e" stroke-width="1"/>
    <text x="720" y="280" fill="#fafaf9" font-size="15" font-weight="700" text-anchor="middle">KubeVirt</text>
    <text x="720" y="300" fill="#a8a29e" font-size="12" text-anchor="middle">VMs · live-migrate</text>
  </g>

  <!-- Footer -->
  <text x="440" y="342" fill="#78716c" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-anchor="middle">aether run · aether score · aether migrate · aether live-migrate</text>
</svg>
