<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Aether: one workload YAML to Podman, Kubernetes, and KubeVirt">
  <!-- Solid fills only. GitHub SVG sanitizer often drops gradients/url(#id) fills,
       which made light text invisible on the light blob/README background. -->
  <rect width="880" height="360" rx="20" fill="#0c0c0f"/>
  <circle cx="120" cy="40" r="90" fill="#3d2314"/>
  <circle cx="780" cy="320" r="110" fill="#2a1c12"/>

  <text x="440" y="42" fill="#fafaf9" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">One spec. Three runtimes.</text>
  <text x="440" y="66" fill="#a8a29e" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle">Deploy / score / migrate - without rewriting infrastructure</text>

  <rect x="290" y="90" width="300" height="56" rx="14" fill="#1c1917" stroke="#f97316" stroke-width="1.5"/>
  <text x="440" y="115" fill="#fb923c" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle">WORKLOAD YAML</text>
  <text x="440" y="134" fill="#fafaf9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">apiVersion: aether/v1</text>

  <line x1="440" y1="146" x2="440" y2="172" stroke="#f97316" stroke-width="2"/>

  <rect x="310" y="172" width="260" height="48" rx="12" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="440" y="201" fill="#fff7ed" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Aether control plane</text>

  <path d="M440 220 L440 236 L160 236 L160 252" fill="none" stroke="#f97316" stroke-width="1.75" opacity="0.7"/>
  <path d="M440 220 L440 252" fill="none" stroke="#f97316" stroke-width="1.75"/>
  <path d="M440 220 L440 236 L720 236 L720 252" fill="none" stroke="#f97316" stroke-width="1.75" opacity="0.7"/>

  <rect x="70" y="252" width="180" height="64" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
  <text x="160" y="280" fill="#fafaf9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Podman</text>
  <text x="160" y="300" fill="#a8a29e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">containers</text>

  <rect x="350" y="252" width="180" height="64" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
  <text x="440" y="280" fill="#fafaf9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Kubernetes</text>
  <text x="440" y="300" fill="#a8a29e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">pods &amp; services</text>

  <rect x="630" y="252" width="180" height="64" rx="14" fill="#1c1917" stroke="#78716c" stroke-width="1"/>
  <text x="720" y="280" fill="#fafaf9" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">KubeVirt</text>
  <text x="720" y="300" fill="#a8a29e" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">VMs / live-migrate</text>

  <text x="440" y="342" fill="#78716c" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">aether run / aether score / aether migrate / aether live-migrate</text>
</svg>
