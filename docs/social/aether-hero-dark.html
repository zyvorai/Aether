<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aether hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  aether-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:112px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Runtime portability plane</span></div>
  <div class="word">Aether</div>
  <div class="tag">One YAML. Three runtimes.<br><em>Zero lock-in.</em></div>
  <div class="lede">Deploy one workload spec to Podman, Kubernetes, or KubeVirt, let intent scoring pick the lane, and migrate between them.</div>
  <div class="stats"><div class="stat"><b>3</b><span>runtimes</span></div><div class="stat"><b>4</b><span>migrate strategies</span></div><div class="stat"><b>1</b><span>workload YAML</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/Aether</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Aether: three tilted orbital lanes (Podman, Kubernetes, KubeVirt) around one workload core.
// A workload capsule migrates from the Kubernetes lane to the KubeVirt lane; each lane carries an intent score bar.
var C = Z.c, cx = 390, cy = 300;
var defs = Z.el('defs', {});
defs.innerHTML = '<filter id="aeGl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="aeSf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>' +
  '<radialGradient id="aeCore"><stop offset="0" stop-color="#ffffff" stop-opacity=".95"/><stop offset=".35" stop-color="#64d2ff" stop-opacity=".8"/><stop offset="1" stop-color="#0071e3" stop-opacity="0"/></radialGradient>' +
  '<radialGradient id="aeHalo"><stop offset="0" stop-color="#2997ff" stop-opacity=".35"/><stop offset="1" stop-color="#2997ff" stop-opacity="0"/></radialGradient>';

// starfield texture
for (var i = 0; i < 90; i++) {
  var sx = 60 + Z.rnd() * 600, sy = 24 + Z.rnd() * 580;
  if (sx < 90 && sy > 430) continue;
  Z.el('circle', { cx: sx.toFixed(1), cy: sy.toFixed(1), r: (0.5 + Z.rnd() * 1.1).toFixed(2), fill: '#cfe6ff', opacity: (0.08 + Z.rnd() * 0.35).toFixed(2) });
}
Z.el('circle', { cx: cx, cy: cy, r: 250, fill: 'url(#aeHalo)' });

var lanes = [
  { name: 'Podman', rx: 250, ry: 66, rot: -28, col: C.violet, score: 0.42 },
  { name: 'Kubernetes', rx: 236, ry: 74, rot: 22, col: C.signal, score: 0.86 },
  { name: 'KubeVirt', rx: 200, ry: 60, rot: 82, col: C.teal, score: 0.64 }
];
function pt(L, t) {
  var a = L.rot * Math.PI / 180, ct = Math.cos(t), st = Math.sin(t);
  return { x: cx + L.rx * ct * Math.cos(a) - L.ry * st * Math.sin(a), y: cy + L.rx * ct * Math.sin(a) + L.ry * st * Math.cos(a), z: st };
}
// back halves first (dim), then core, then front halves (bright)
function drawLane(L, front) {
  var n = 120;
  for (var k = 0; k < n; k++) {
    var t0 = k / n * Math.PI * 2, t1 = (k + 1) / n * Math.PI * 2, p0 = pt(L, t0), p1 = pt(L, t1);
    var isFront = (p0.z + p1.z) > 0;
    if (isFront !== front) continue;
    var depth = (p0.z + p1.z) / 2;
    Z.el('line', { x1: p0.x.toFixed(1), y1: p0.y.toFixed(1), x2: p1.x.toFixed(1), y2: p1.y.toFixed(1), stroke: L.col,
      'stroke-width': front ? 2.2 : 1.2, 'stroke-linecap': 'round', opacity: (front ? 0.55 + depth * 0.4 : 0.18 + (1 + depth) * 0.15).toFixed(2) });
  }
  // orbiting debris dots
  for (var k = 0; k < 7; k++) {
    var p = pt(L, Z.rnd() * Math.PI * 2);
    if ((p.z > 0) !== front) continue;
    Z.el('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: front ? 2.4 : 1.6, fill: L.col, opacity: front ? .9 : .4 });
  }
}
lanes.forEach(function (L) { drawLane(L, false); });

// core: workload spec
Z.el('circle', { cx: cx, cy: cy, r: 70, fill: 'url(#aeCore)', opacity: .55, filter: 'url(#aeSf)' });
Z.el('circle', { cx: cx, cy: cy, r: 46, fill: 'rgba(6,10,18,.94)', stroke: C.cyan, 'stroke-width': 1.6, filter: 'url(#aeGl)' });
Z.el('circle', { cx: cx, cy: cy, r: 38, fill: 'none', stroke: 'rgba(100,210,255,.3)', 'stroke-dasharray': '2 4' });
Z.label(cx, cy, '<b>YAML</b><span>workload</span>');

lanes.forEach(function (L) { drawLane(L, true); });

// migration: capsule leaves the Kubernetes lane and transfers onto the KubeVirt lane
var A = pt(lanes[1], 0.55), B = pt(lanes[2], 0.35);
var mid = { x: (A.x + B.x) / 2 + 70, y: (A.y + B.y) / 2 + 10 };
var trail = 'M' + A.x.toFixed(1) + ',' + A.y.toFixed(1) + ' Q' + mid.x.toFixed(1) + ',' + mid.y.toFixed(1) + ' ' + B.x.toFixed(1) + ',' + B.y.toFixed(1);
Z.el('path', { d: trail, fill: 'none', stroke: '#fff', 'stroke-width': 1.4, 'stroke-dasharray': '3 6', opacity: .55 });
var tp = Z.el('path', { d: trail, fill: 'none', stroke: 'none' }), TL = tp.getTotalLength();
for (var k = 1; k < 8; k++) {
  var q = tp.getPointAtLength(TL * k / 8);
  Z.el('circle', { cx: q.x.toFixed(1), cy: q.y.toFixed(1), r: (0.8 + k * 0.25).toFixed(2), fill: C.cyan, opacity: (0.15 + k * 0.08).toFixed(2) });
}
Z.el('circle', { cx: A.x.toFixed(1), cy: A.y.toFixed(1), r: 5, fill: 'none', stroke: C.signal, 'stroke-width': 1.5, opacity: .8 });
// capsule
var cap = Z.g({ transform: 'translate(' + B.x.toFixed(1) + ',' + B.y.toFixed(1) + ') rotate(-30)' });
Z.el('rect', { x: -22, y: -10, width: 44, height: 20, rx: 10, fill: 'rgba(64,200,224,.25)', stroke: '#fff', 'stroke-width': 1.6, filter: 'url(#aeGl)' }, cap);
Z.el('line', { x1: 0, y1: -9, x2: 0, y2: 9, stroke: 'rgba(255,255,255,.6)', 'stroke-width': 1 }, cap);
Z.el('circle', { cx: -10, cy: 0, r: 3, fill: C.cyan }, cap);
Z.el('circle', { cx: 10, cy: 0, r: 3, fill: '#fff' }, cap);
Z.label(B.x + 34, B.y + 32, '<span style="color:#e5e5ea">demo-webserver</span><span class="cy">migrate &rarr; kubevirt</span>', 'left');

// lane labels with intent score bars
function bar(s, col) {
  return '<i style="display:inline-block;width:70px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:5px;position:relative;vertical-align:middle">' +
    '<i style="position:absolute;left:0;top:0;bottom:0;width:' + Math.round(s * 70) + 'px;border-radius:3px;background:' + col + ';box-shadow:0 0 8px ' + col + '"></i></i>';
}
function laneLabel(L, x, y, extra) {
  Z.label(x, y, '<b style="color:' + L.col + '">' + L.name + '</b>' + bar(L.score, L.col) + (extra || ''), 'box');
}
var pP = pt(lanes[0], Math.PI * 0.97), pK = pt(lanes[1], -0.12), pV = pt(lanes[2], Math.PI * 1.06);
function leader(p, x, y, col) {
  Z.el('line', { x1: p.x.toFixed(1), y1: p.y.toFixed(1), x2: x, y2: y, stroke: col, 'stroke-width': 1, opacity: .5, 'stroke-dasharray': '2 3' });
  Z.el('circle', { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: 3.5, fill: col, filter: 'url(#aeGl)' });
}
leader(pP, 165, 448, lanes[0].col);
leader(pK, 590, 448, lanes[1].col);
leader(pV, 470, 92, lanes[2].col);
laneLabel(lanes[0], 165, 468);
laneLabel(lanes[1], 590, 470, '<span class="ok">selected</span>');
laneLabel(lanes[2], 530, 92);
Z.label(cx, 572, '<b>intent score</b><span>cost &middot; performance &middot; reliability</span>');
Z.label(250, 44, 'immediate &middot; blue-green &middot; rolling &middot; live', 'chip', 'font-size:11.5px');
})();
</script>
</body>
</html>
