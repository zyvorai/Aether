{{- range $key, $rc := .Values.runtimeClasses }}
{{- if $rc.enabled }}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ $rc.name }}
  labels:
    app.kubernetes.io/name: zyvor-confidential-kata
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    ragnarok.zyvor.dev/fabric: confidential
handler: {{ $rc.handler }}
{{- if $rc.nodeSelector }}
scheduling:
  nodeSelector:
{{- range $k, $v := $rc.nodeSelector }}
    {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
