# Strategic merge patch: mount host SPIRE agent socket into ragnarok-backend (single-replica lab).
# Apply via: ./scripts/enable-confidential-production.sh --spire --mount-agent-socket
spec:
  template:
    spec:
      containers:
        - name: backend
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/sockets
              readOnly: true
      volumes:
        - name: spire-agent-socket
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
