# Strategic merge: SPIFFE CSI workload API socket (PSS-restricted safe; no hostPath in app pod).
# Requires spire-spiffe-csi-driver from install-confidential-spire.sh
spec:
  template:
    metadata:
      labels:
        spiffe.io/spire-managed-identity: "true"
    spec:
      containers:
        - name: backend
          volumeMounts:
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
