# Optional clusterwide add-on (pair with cilium-aether-egress-strict-cluster.yaml).
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: aether-control-plane-egress-strict-cluster
spec:
  endpointSelector:
    matchLabels:
      k8s:app: aether
      k8s:io.kubernetes.pod.namespace: __AETHER_NAMESPACE__
  egress:
    - toEntities:
        - cluster
