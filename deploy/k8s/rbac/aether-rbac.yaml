# RBAC for the in-cluster Aether control plane (serve API + reconcile workloads).
# Namespace placeholder __AETHER_NAMESPACE__ is substituted by deploy scripts.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aether
  namespace: __AETHER_NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aether-discovery
rules:
  # Core workloads & config
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
      - services
      - configmaps
      - secrets
      - nodes
      - namespaces
      - persistentvolumes
      - persistentvolumeclaims
      - resourcequotas
      - limitranges
      - serviceaccounts
      - events
      - endpoints
    verbs: [get, list, watch, create, update, patch, delete]
  # Apps / batch / autoscaling / networking
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["autoscaling"]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["discovery.k8s.io"]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [get, list, watch, create, update, patch, delete]
  # KubeVirt + CDI (VMs, instances, data volumes)
  - apiGroups: ["kubevirt.io"]
    resources: [virtualmachines, virtualmachineinstances]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: [datavolumes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Metal3 bare metal
  - apiGroups: ["metal3.io"]
    resources: [baremetalhosts]
    verbs: [get, list, watch, create, update, patch, delete]
  # CRD discovery (inventory / dynamic clients)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  # Cilium CNI policies (status API + inventory)
  - apiGroups: ["cilium.io"]
    resources: [ciliumnetworkpolicies, ciliumclusterwidenetworkpolicies]
    verbs: [get, list, watch]
  # metrics-server PodMetrics / NodeMetrics (cluster browser utilization)
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aether-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aether-discovery
subjects:
  - kind: ServiceAccount
    name: aether
    namespace: __AETHER_NAMESPACE__
