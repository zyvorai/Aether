# Production Database Template
# Stateful database with persistence, backups, and monitoring

metadata:
  name: postgres-db
  owner: data-team
  project: production
  description: "Production PostgreSQL database with HA and backups"
  labels:
    app: database
    tier: backend
    database: postgres
    environment: production

image:
  registry: docker.io
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

requirements:
  cpu: "4"
  memory: "16Gi"
  storage: "500Gi"
  gpu: null

runtime:
  preferred: Kube
  allowed:
    - Kube
  disallowed:
    - Container

scaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1

network:
  service: true
  serviceType: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP

persistence:
  enabled: true
  storageClass: fast-ssd
  accessMode: ReadWriteOnce
  mountPath: /var/lib/postgresql/data
  subPath: postgres

health:
  liveness:
    enabled: true
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelay: 60
    period: 10
    timeout: 5
    failureThreshold: 5

  readiness:
    enabled: true
    exec:
      command:
        - pg_isready
        - -U
        - postgres
    initialDelay: 10
    period: 5
    timeout: 3
    failureThreshold: 3

env:
  - name: POSTGRES_DB
    value: appdb
  - name: POSTGRES_USER
    valueFrom:
      secretRef:
        name: postgres-credentials
        key: username
  - name: POSTGRES_PASSWORD
    valueFrom:
      secretRef:
        name: postgres-credentials
        key: password
  - name: PGDATA
    value: /var/lib/postgresql/data/pgdata
  - name: POSTGRES_INITDB_ARGS
    value: "--encoding=UTF8 --locale=en_US.UTF-8"

configMaps:
  - name: postgres-config
    mountPath: /etc/postgresql
    items:
      - key: postgresql.conf
        path: postgresql.conf
      - key: pg_hba.conf
        path: pg_hba.conf

secrets:
  - name: postgres-credentials
    mountPath: /etc/secrets
    items:
      - key: username
        path: username
      - key: password
        path: password

resources:
  limits:
    cpu: "8"
    memory: "32Gi"
  requests:
    cpu: "4"
    memory: "16Gi"

security:
  runAsNonRoot: true
  runAsUser: 999
  fsGroup: 999
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

monitoring:
  enabled: true
  path: /metrics
  port: 9187
  interval: 30s

annotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "9187"
  backup.velero.io/backup-volumes: "postgres-data"
  backup.schedule: "0 2 * * *"
