[package]
name = "orchestr8"
version = "0.1.0"
edition = "2021"
authors = ["Susant Sahani <ssahani@gmail.com>"]
description = "Universal runtime control plane - One spec, three runtimes (Container, Kubernetes, KubeVirt, Metal3)"
license = "MIT OR Apache-2.0"

[dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Kubernetes client
kube = { version = "0.97", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# HTTP client for Metal3/APIs
reqwest = { version = "0.12", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process execution (for Podman)
which = "7.0"

# Async trait support
async-trait = "0.1"

# Date/time
chrono = "0.4"

[dev-dependencies]
tempfile = "3.15"
tokio-test = "0.4"

[[bin]]
name = "orchestr8"
path = "src/main.rs"

[lib]
name = "orchestr8"
path = "src/lib.rs"
