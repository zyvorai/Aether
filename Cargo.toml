[package]
name = "aether"
version = "0.4.0"
edition = "2021"
authors = ["ZyvorAI Labs Private Limited <ssahani@gmail.com>"]
description = "Universal runtime control plane - One spec, three runtimes (Container, Kubernetes, KubeVirt)"
license = "LicenseRef-Zyvor-Production-2.0"
build = "build.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.54", features = ["full"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# CLI framework
clap = { version = "4.6", features = ["derive", "cargo", "env"] }
clap_complete = "4.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# TUI framework
ratatui = "0.30"
crossterm = "0.29"

# Kubernetes client
kube = { version = "5", features = ["client", "runtime", "derive", "ws"] }
k8s-openapi = { version = "0.29", features = ["latest"] }

# HTTP client for external APIs
reqwest = { version = "0.12", features = ["json", "blocking"] }

# API Server
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["fs", "cors"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Distributed tracing (OTLP export, opt-in via AETHER_OTLP_ENDPOINT)
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34"

# Process execution (for Podman)
which = "8"

# Async trait support
async-trait = "0.1"

# Date/time
chrono = "0.4"

# Metrics
prometheus = "0.14"

# Email (SMTP)
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname"] }

# Utilities
dirs = "7"

# Pretty terminal output (matching HyperSDK UX)
colored = "3"
indicatif = "0.18"
comfy-table = "8"
libc = "0.2.191"
aes-gcm = "0.11"
aes = "0.9"
cbc = "0.2"
sha2 = "0.11"
openidconnect = { version = "4", default-features = false, features = ["reqwest"] }
jsonwebtoken = { version = "12", default-features = false, features = ["use_pem", "rust_crypto"] }
rand = "0.10"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
url = "2"
base64 = "0.23"
ed25519-dalek = "3"
flate2 = "1.1"
rsa = { version = "0.10", features = ["pkcs1v15"] }
x509-parser = "0.18"
ldap3 = { version = "0.12", default-features = false, features = ["sync", "tls-rustls-ring"] }

[dev-dependencies]
tempfile = "3.27"
tokio-test = "0.4"
http = "1"
hyper = "1"
bytes = "1"

[[bin]]
name = "aether"
path = "src/main.rs"

[lib]
name = "aether"
path = "src/lib.rs"
