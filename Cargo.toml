[package]
name = "orchestr8"
version = "0.3.0"
edition = "2021"
authors = ["Susant Sahani <ssahani@gmail.com>"]
description = "Universal runtime control plane - One spec, four runtimes (Container, Kubernetes, KubeVirt, Metal3)"
license = "Proprietary"

[dependencies]
# Core async runtime
tokio = { version = "1.42", features = ["full"] }
futures = "0.3"

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
clap_complete = "4.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# TUI framework
ratatui = "0.29"
crossterm = "0.28"

# Kubernetes client
kube = { version = "0.97", features = ["client", "runtime", "derive"] }
k8s-openapi = { version = "0.23", features = ["latest"] }

# HTTP client for Metal3/APIs
reqwest = { version = "0.12", features = ["json", "blocking"] }

# API Server
axum = "0.7"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Process execution (for Podman)
which = "7.0"

# Async trait support
async-trait = "0.1"

# Date/time
chrono = "0.4"

# Metrics
prometheus = "0.13"

# Utilities
dirs = "5.0"

# Pretty terminal output (matching HyperSDK UX)
colored = "2.1"
indicatif = "0.17"
comfy-table = "7.1"
libc = "0.2.184"
aes-gcm = "0.10"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.15"
tokio-test = "0.4"
http = "1"
hyper = "1"
bytes = "1"

[[bin]]
name = "orchestr8"
path = "src/main.rs"

[lib]
name = "orchestr8"
path = "src/lib.rs"
