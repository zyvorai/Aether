{{- /* Always create this Secret now (used to be gated behind $createSecret, so a
       default install where nothing was explicitly configured got no Secret at all —
       api-key and encryption-key below need to exist unconditionally so the app never
       falls through to its own insecure defaults: src/api/mod.rs allows all requests
       when no API key is configured, and src/secrets.rs derives a low-entropy,
       largely-public encryption key from the pod's HOSTNAME when AETHER_SECRET_KEY is
       unset. */}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aether.fullname" . }}-secrets
  labels:
    {{- include "aether.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" (include "aether.fullname" .))) -}}
  {{- if .Values.apiKey.value }}
  api-key: {{ .Values.apiKey.value | b64enc | quote }}
  {{- else }}
  api-key: {{ if (and $existingSecret (index $existingSecret.data "api-key")) }}{{ index $existingSecret.data "api-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- end }}
  {{- if .Values.secretKey.value }}
  encryption-key: {{ .Values.secretKey.value | b64enc | quote }}
  {{- else }}
  encryption-key: {{ if (and $existingSecret (index $existingSecret.data "encryption-key")) }}{{ index $existingSecret.data "encryption-key" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
  {{- end }}
stringData:
  {{- if .Values.postgresql.databaseUrl }}
  {{ .Values.postgresql.secretKey }}: {{ .Values.postgresql.databaseUrl | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  {{ .Values.redis.secretKey }}: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.oidc.enabled }}
  issuer: {{ .Values.oidc.issuer | quote }}
  client-id: {{ .Values.oidc.clientId | quote }}
  redirect-uri: {{ .Values.oidc.redirectUri | quote }}
  session-secret: {{ .Values.oidc.sessionSecret | quote }}
  {{- if .Values.oidc.clientSecret }}
  client-secret: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.oidc.roleMap }}
  oidc-role-map: {{ .Values.oidc.roleMap | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.saml.enabled }}
  saml-idp-sso-url: {{ .Values.saml.idpSsoUrl | quote }}
  saml-idp-entity-id: {{ .Values.saml.idpEntityId | quote }}
  saml-acs-url: {{ .Values.saml.acsUrl | quote }}
  saml-session-secret: {{ .Values.saml.sessionSecret | default .Values.oidc.sessionSecret | quote }}
  {{- if .Values.saml.spEntityId }}
  saml-sp-entity-id: {{ .Values.saml.spEntityId | quote }}
  {{- end }}
  {{- if .Values.saml.idpCert }}
  saml-idp-cert: {{ .Values.saml.idpCert | quote }}
  {{- end }}
  {{- if .Values.saml.roleMap }}
  saml-role-map: {{ .Values.saml.roleMap | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.ldap.enabled }}
  ldap-url: {{ .Values.ldap.url | quote }}
  ldap-base-dn: {{ .Values.ldap.baseDn | quote }}
  ldap-session-secret: {{ .Values.ldap.sessionSecret | default .Values.oidc.sessionSecret | quote }}
  {{- if .Values.ldap.domain }}
  ldap-domain: {{ .Values.ldap.domain | quote }}
  {{- end }}
  {{- if .Values.ldap.bindDn }}
  ldap-bind-dn: {{ .Values.ldap.bindDn | quote }}
  {{- end }}
  {{- if .Values.ldap.bindPassword }}
  ldap-bind-password: {{ .Values.ldap.bindPassword | quote }}
  {{- end }}
  {{- if .Values.ldap.roleMap }}
  ldap-role-map: {{ .Values.ldap.roleMap | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.backupRemote.enabled }}
  backup-remote-url: {{ .Values.backupRemote.url | quote }}
  {{- if .Values.backupRemote.token }}
  backup-remote-token: {{ .Values.backupRemote.token | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.auditWebhook.enabled }}
  audit-webhook-url: {{ .Values.auditWebhook.url | quote }}
  {{- end }}
