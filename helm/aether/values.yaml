# Default values for aether
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/ssahani/aether
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Rules for the ClusterRole
  rules:
    - apiGroups: [""]
      resources:
        - pods
        - pods/log
        - pods/status
        - services
        - configmaps
        - secrets
        - nodes
        - namespaces
        - persistentvolumes
        - persistentvolumeclaims
        - resourcequotas
        - limitranges
        - serviceaccounts
        - events
        - endpoints
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["apps"]
      resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["batch"]
      resources: ["jobs", "cronjobs"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["networking.k8s.io"]
      resources: ["ingresses", "networkpolicies"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["discovery.k8s.io"]
      resources: ["endpointslices"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["storage.k8s.io"]
      resources: ["storageclasses"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["autoscaling"]
      resources: ["horizontalpodautoscalers"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["kubevirt.io"]
      resources: ["virtualmachines", "virtualmachineinstances"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["cdi.kubevirt.io"]
      resources: ["datavolumes"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["metal3.io"]
      resources: ["baremetalhosts"]
      verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    - apiGroups: ["apiextensions.k8s.io"]
      resources: ["customresourcedefinitions"]
      verbs: ["get", "list", "watch"]

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080
  annotations: {}

metrics:
  enabled: true
  port: 9090
  path: /metrics
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    namespace: ""
    additionalLabels: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: aether.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: aether-tls
  #    hosts:
  #      - aether.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Voluntary disruption budget — auto-enabled when replicaCount (or HPA minReplicas) >= 2.
# With a single replica, keep podDisruptionBudget.enabled=false and auto=false (or set maxUnavailable: 1).
podDisruptionBudget:
  enabled: false
  auto: true
  minAvailable: 1
  # If set (e.g. "25%" or 1), minAvailable is ignored — use for single-replica clusters that still want a PDB.
  maxUnavailable: ""

# Spread pods across failure domains (zones) when running multiple replicas.
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}

tolerations: []

affinity: {}

# Aether specific configuration
aether:
  # Default namespace for workload deployment
  namespace: default

  # Logging configuration
  logging:
    level: info  # debug, info, warn, error
    format: json  # json, text

  # State storage
  stateStorage:
    # Storage class for state persistence
    storageClassName: ""
    size: 1Gi
    # Path to mount state directory
    mountPath: /var/lib/aether

  # Runtime configurations
  runtimes:
    podman:
      enabled: true
      socket: unix:///var/run/podman/podman.sock

    kubernetes:
      enabled: true
      inCluster: true
      # External kubeconfig (if not in-cluster)
      # kubeconfig: /etc/kubeconfig

    kubevirt:
      enabled: false
      # Requires KubeVirt CRDs to be installed

    metal3:
      enabled: false
      # Requires Metal3 CRDs to be installed
      bmcCredentials:
        secretName: ""

  # Migration settings
  migration:
    # Default strategy: immediate, blue-green, rolling
    defaultStrategy: blue-green
    validationDelay: 30s
    rollbackOnFailure: true

  # Metrics configuration
  metrics:
    enabled: true
    exportInterval: 30s

# Persistence for workload state
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi
  annotations: {}

# ConfigMap for additional configuration
config:
  # Additional configuration files
  files: {}
    # workload.yaml: |
    #   apiVersion: aether/v1
    #   kind: Workload
    #   ...

# Secrets for runtime credentials
secrets:
  # Container registry credentials
  registryCredentials: {}
    # dockerconfigjson: base64-encoded-docker-config

  # Metal3 BMC credentials
  bmcCredentials: {}
    # username: admin
    # password: password

  # Additional secrets
  additional: {}
