site_name: Aether
site_description: The universal runtime control plane — one workload spec that scores and migrates across Podman, Kubernetes, and KubeVirt.
site_url: https://zyvorai.github.io/Aether/
repo_url: https://github.com/zyvorai/Aether
repo_name: zyvorai/Aether
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  /README.md
theme:
  name: material
  custom_dir: docs/overrides
  logo: material/transit-connection-variant
  favicon: material/transit-connection-variant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: orange
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: orange
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.tabs, navigation.sections, navigation.top, navigation.footer, content.code.copy, search.suggest, search.highlight, toc.follow]
plugins: [search]
hooks:
  - docs/overrides/hooks.py
extra_css:
  - stylesheets/apple-glass.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - {name: mermaid, class: mermaid, format: !!python/name:pymdownx.superfences.fence_code_format }
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - tables
  - toc: {permalink: true}
